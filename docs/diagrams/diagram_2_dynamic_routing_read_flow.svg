<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="100%" height="100%" style="background:#090d12; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1118"/>
      <stop offset="100%" stop-color="#05080c"/>
    </linearGradient>
    <linearGradient id="cyanGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5dfeca"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#5dfeca"/>
    </marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#c084fc"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="1400" height="900" fill="url(#bgGrad2)" rx="16"/>

  <!-- Title Header -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="8" height="42" rx="4" fill="url(#cyanGrad2)"/>
    <text x="24" y="28" fill="#ffffff" font-size="26" font-weight="700">Dynamic Routing &amp; Data Read Lifecycle (/event/[slug])</text>
    <text x="24" y="48" fill="#94a3b8" font-size="14">Step-by-step Execution: Browser Navigation → RSC Async Params → API Route → Concurrent Actions → Hydration</text>
  </g>

  <!-- Lifeline Columns -->
  <!-- Col 1: Browser -->
  <g transform="translate(80, 120)">
    <rect width="180" height="50" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow2)"/>
    <text x="90" y="30" fill="#38bdf8" font-size="14" font-weight="700" text-anchor="middle">1. Client / Browser</text>
    <line x1="90" y1="50" x2="90" y2="720" stroke="#334155" stroke-width="1.5" stroke-dasharray="6"/>
  </g>

  <!-- Col 2: RSC Page -->
  <g transform="translate(340, 120)">
    <rect width="220" height="50" rx="10" fill="#16222f" stroke="#5dfeca" stroke-width="1.5" filter="url(#shadow2)"/>
    <text x="110" y="24" fill="#5dfeca" font-size="13" font-weight="700" text-anchor="middle">2. app/event/[slug]/page.tsx</text>
    <text x="110" y="40" fill="#94a3b8" font-size="11" text-anchor="middle">React Server Component</text>
    <line x1="110" y1="50" x2="110" y2="720" stroke="#334155" stroke-width="1.5" stroke-dasharray="6"/>
  </g>

  <!-- Col 3: API Route -->
  <g transform="translate(640, 120)">
    <rect width="200" height="50" rx="10" fill="#1f1830" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow2)"/>
    <text x="100" y="24" fill="#c084fc" font-size="13" font-weight="700" text-anchor="middle">3. /api/events/[slug]</text>
    <text x="100" y="40" fill="#94a3b8" font-size="11" text-anchor="middle">Route Handler (GET)</text>
    <line x1="100" y1="50" x2="100" y2="720" stroke="#334155" stroke-width="1.5" stroke-dasharray="6"/>
  </g>

  <!-- Col 4: Server Actions -->
  <g transform="translate(910, 120)">
    <rect width="200" height="50" rx="10" fill="#1e1b2e" stroke="#f472b6" stroke-width="1.5" filter="url(#shadow2)"/>
    <text x="100" y="24" fill="#f472b6" font-size="13" font-weight="700" text-anchor="middle">4. lib/actions/*</text>
    <text x="100" y="40" fill="#94a3b8" font-size="11" text-anchor="middle">booking &amp; event actions</text>
    <line x1="100" y1="50" x2="100" y2="720" stroke="#334155" stroke-width="1.5" stroke-dasharray="6"/>
  </g>

  <!-- Col 5: Database -->
  <g transform="translate(1170, 120)">
    <rect width="170" height="50" rx="10" fill="#14231b" stroke="#34d399" stroke-width="1.5" filter="url(#shadow2)"/>
    <text x="85" y="24" fill="#34d399" font-size="13" font-weight="700" text-anchor="middle">5. MongoDB Atlas</text>
    <text x="85" y="40" fill="#94a3b8" font-size="11" text-anchor="middle">via lib/mongodb.ts</text>
    <line x1="85" y1="50" x2="85" y2="720" stroke="#334155" stroke-width="1.5" stroke-dasharray="6"/>
  </g>

  <!-- Steps / Interactions -->

  <!-- Step 1: User Navigates -->
  <g transform="translate(0, 190)">
    <line x1="170" y1="20" x2="445" y2="20" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrBlue)"/>
    <rect x="200" y="5" width="220" height="28" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="310" y="24" fill="#38bdf8" font-size="12" font-weight="600" text-anchor="middle">1. Request URL /event/react-summit-2026</text>
  </g>

  <!-- Step 2: Next.js 16 Awaits Params -->
  <g transform="translate(370, 240)">
    <rect width="160" height="40" rx="6" fill="#162e24" stroke="#5dfeca" stroke-width="1"/>
    <text x="80" y="18" fill="#5dfeca" font-size="11" font-weight="700" text-anchor="middle">Next.js 16 Async Params</text>
    <text x="80" y="32" fill="#94a3b8" font-size="10" text-anchor="middle">const { slug } = await params;</text>
  </g>

  <!-- Step 3: Fetch API Route -->
  <g transform="translate(0, 300)">
    <line x1="450" y1="20" x2="735" y2="20" stroke="#5dfeca" stroke-width="2" marker-end="url(#arrCyan)"/>
    <rect x="470" y="5" width="250" height="28" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="595" y="24" fill="#5dfeca" font-size="11" font-weight="600" text-anchor="middle">2. fetch(`${BASE_URL}/api/events/${slug}`, { revalidate: 60 })</text>
  </g>

  <!-- Step 4: API queries Mongo -->
  <g transform="translate(0, 350)">
    <line x1="740" y1="20" x2="1250" y2="20" stroke="#c084fc" stroke-width="2" marker-end="url(#arrPurple)"/>
    <rect x="800" y="5" width="380" height="28" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="990" y="24" fill="#c084fc" font-size="11" font-weight="600" text-anchor="middle">3. Event.findOne({ slug }).lean() &amp; slug regex validation</text>
  </g>

  <!-- Step 5: Mongo returns to API -->
  <g transform="translate(0, 395)">
    <line x1="1255" y1="20" x2="745" y2="20" stroke="#34d399" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrGreen)"/>
    <rect x="880" y="5" width="220" height="28" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="990" y="24" fill="#34d399" font-size="11" text-anchor="middle">4. Return plain Event JSON document</text>
  </g>

  <!-- Step 6: API returns to Page -->
  <g transform="translate(0, 440)">
    <line x1="740" y1="20" x2="455" y2="20" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrBlue)"/>
    <rect x="500" y="5" width="190" height="28" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="595" y="24" fill="#38bdf8" font-size="11" text-anchor="middle">5. 200 OK Response { event }</text>
  </g>

  <!-- Step 7: Concurrent Promise.all in Page -->
  <g transform="translate(420, 490)">
    <rect width="660" height="130" rx="10" fill="#181e28" stroke="#f472b6" stroke-width="1.2" stroke-dasharray="3"/>
    <text x="20" y="24" fill="#f472b6" font-size="12" font-weight="700">6. Concurrent Data Fetching: Promise.all([ getBookingCount, getSimilarEventsBySlug ])</text>
    
    <!-- Action A -->
    <line x1="30" y1="50" x2="585" y2="50" stroke="#f472b6" stroke-width="1.5" marker-end="url(#arrPurple)"/>
    <text x="310" y="45" fill="#e2e8f0" font-size="11" text-anchor="middle">getBookingCount(event._id) → Booking.countDocuments({ eventId })</text>
    
    <!-- Action B -->
    <line x1="30" y1="95" x2="585" y2="95" stroke="#f472b6" stroke-width="1.5" marker-end="url(#arrPurple)"/>
    <text x="310" y="90" fill="#e2e8f0" font-size="11" text-anchor="middle">getSimilarEventsBySlug(slug) → Event.find({ tags: { $in: event.tags } }).limit(4)</text>
  </g>

  <!-- Step 8: Render Page with Client Sub-components -->
  <g transform="translate(0, 645)">
    <line x1="450" y1="20" x2="175" y2="20" stroke="#5dfeca" stroke-width="2" marker-end="url(#arrCyan)"/>
    <rect x="200" y="5" width="220" height="28" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="310" y="24" fill="#5dfeca" font-size="11" font-weight="700" text-anchor="middle">7. Stream Hydrated HTML to Client</text>
  </g>

  <!-- Final State Box -->
  <g transform="translate(80, 750)">
    <rect width="1240" height="90" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <text x="20" y="28" fill="#5dfeca" font-size="14" font-weight="700">Client-Side UI Composition:</text>
    <text x="20" y="52" fill="#94a3b8" font-size="12">• Left Side: Banner Image, Overview, Agenda, Tags, Organizer Info, Similar Events List (&lt;EventCard /&gt;)</text>
    <text x="20" y="72" fill="#94a3b8" font-size="12">• Right Side Sidebar: Booking Spot Banner ("Join X people...") + Interactive &lt;BookEvent eventId={_id} slug={slug} /&gt;</text>
  </g>
</svg>
